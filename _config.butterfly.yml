search:
  use:

inject:
  head:
    - >-
      <script>(function(){try{var K='fs-theme',saved=null;try{var raw=localStorage.getItem(K);if(raw){var o=JSON.parse(raw);if(o&&o.v&&(Date.now()-(o.t||0))<365*864e5)saved=o.v}}catch(e){}var u=new URLSearchParams(location.search).get('theme');var mode=(u==='light'||u==='dark')?u:(saved==='light'||saved==='dark'?saved:(window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));document.documentElement.setAttribute('data-theme',mode);document.documentElement.classList.add('js');var m=document.querySelector('meta[name="theme-color"]');if(m){m.setAttribute('content',mode==='dark'?'#0f1111':'#f3f6f2')}}catch(e){document.documentElement.setAttribute('data-theme','light')}})();</script>
    - <link rel="stylesheet" href="/css/cyber-background.css?v=20261011_v1">
    - <link rel="stylesheet" href="/css/footer-brand.css?v=20261011_v1">
  bottom:
    - <script src="/js/site-ui.js?v=20261011_v1" defer></script>
    - <script src="/js/footer-brand.js?v=20261011_v1" defer></script>

