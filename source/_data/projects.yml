    featured: true
    desc: 基于 Node.js 独立研发的轻量级博客全生命周期本地管理控制台。构建了双栏 AST 实时预览编辑器、自动化 WebP 图片转换与引用清洗管线、6 并发全网死链健康探测、近 365 天 GitHub 风格创作热力图，以及具备版本快照对比与回收站恢复机制的轻量数据治理架构。
    tags:
      - Node.js
      - Express 5
      - Vanilla JS
      - cwebp Pipeline
      - Hexo
      - SSE Live Stream
