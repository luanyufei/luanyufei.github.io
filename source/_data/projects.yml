    desc: 基于生成对抗网络（GAN）构建高保真面部特征解耦与特征融合管线。实现多姿态与不同光照条件下的高分辨率面部属性迁移与边缘平滑融合，设计了多尺度判别器与身份保持损失（Identity-Preserving Loss）以提升换脸真实感与细节保真度。
